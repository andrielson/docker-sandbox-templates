name: CI

# No workflow-level `paths` filter: the `main` ruleset requires the Hygiene
# and Test suite checks on every pull request, and a workflow skipped by path
# filtering never reports them, leaving the PR unmergeable. Jobs skip through
# `if:` conditions instead — a skipped job reports success.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

# Fork pull requests run with a read-only token and no secrets; the publish
# path is push-to-main only, which a fork can never produce. This workflow
# must never use pull_request_target (base-repo permissions over fork code).
# Third-party actions are pinned by commit SHA, never by a moving tag.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # hygiene and test-suite gate on the same path set — one output for both
      hygiene: ${{ steps.filter.outputs.hygiene }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Check out the repository (full history, for the range diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # workflow_dispatch runs everything (the manual self-heal path); a pull
      # request diffs its own range; a push to main is a pull request merge
      # (direct pushes are blocked by the ruleset), so HEAD~1...HEAD is
      # exactly the merged pull request's diff — for both squash and merge
      # commits.
      - name: Decide which jobs the changed paths concern
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            echo 'hygiene=true' >> "${GITHUB_OUTPUT}"
            echo 'release=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          else
            range='HEAD~1...HEAD'
          fi
          hygiene_paths=$(git diff --name-only "${range}" -- src tests .github/workflows/ci.yml package.json bun.lock)
          if [[ -n "${hygiene_paths}" ]]; then
            echo 'hygiene=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'hygiene=false' >> "${GITHUB_OUTPUT}"
          fi
          release_paths=$(git diff --name-only "${range}" -- src .github/workflows/ci.yml package.json)
          if [[ -n "${release_paths}" ]]; then
            echo 'release=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'release=false' >> "${GITHUB_OUTPUT}"
          fi

  hygiene:
    name: Hygiene
    needs: changes
    # Skipped — which reports success, so the ruleset's required check still
    # passes — when the diff touches none of the gate paths above:
    # documentation-only and repository-machinery changes validate locally
    # through pre-commit.
    if: needs.changes.outputs.hygiene == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun (reads the version from packageManager)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # apt ships an older minor than the 0.10+ the README requires
      - name: Install ShellCheck
        run: |
          shellcheck_version='v0.10.0'
          curl --fail --silent --show-error --location \
            --output "/tmp/shellcheck-${shellcheck_version}.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${shellcheck_version}/shellcheck-${shellcheck_version}.linux.x86_64.tar.xz"
          tar --extract --xz --file "/tmp/shellcheck-${shellcheck_version}.tar.xz" --directory /tmp
          install --directory "$HOME/.local/bin"
          install --mode=0755 "/tmp/shellcheck-${shellcheck_version}/shellcheck" "$HOME/.local/bin/shellcheck"
      - name: Biome
        run: bun run lint
      - name: Prettier
        run: bun run format:check
      - name: Type check
        run: bun run typecheck
      - name: ShellCheck
        run: bun run lint:sh
      - name: Compose schema
        run: bun run lint:compose

  test-suite:
    name: Test suite
    needs: [changes, hygiene]
    # Draft PRs run hygiene only; the suite joins when the PR is ready for
    # review (ready_for_review re-triggers this workflow). Skipped together
    # with hygiene when the diff matches no gate path. It deliberately never
    # runs on pushes to main: the ruleset already required it green on the
    # pull request, so re-running it on the merge adds a heavy build for no
    # new signal.
    if: needs.changes.outputs.hygiene == 'true' && ((github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun (reads the version from packageManager)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Missing before the first Publish runs (cold bootstrap) — falls
      # through to a cold build.
      - name: Pull the latest published image (cache source)
        id: pull-latest
        continue-on-error: true
        run: docker pull ghcr.io/andrielson/sandbox-templates:claude-code-docker
      # Warms the daemon-side BuildKit cache so the suite's compose build
      # resolves as cache hits; the published image carries inline cache
      # metadata precisely for this docker-build cache-from path.
      - name: Warm the daemon build cache from the published image
        if: steps.pull-latest.outcome == 'success'
        run: docker build --cache-from ghcr.io/andrielson/sandbox-templates:claude-code-docker --tag sandbox-templates:claude-code-docker src
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the suite
        id: suite
        continue-on-error: true
        timeout-minutes: 75
        run: bun test
      # One full-suite retry: a network hiccup mid-build gets a second chance
      # (the daemon cache from the first attempt makes the rebuild cheap),
      # while a real regression fails deterministically twice.
      - name: Retry the suite once
        if: steps.suite.outcome == 'failure'
        timeout-minutes: 75
        run: bun test

  publish:
    name: Publish
    needs: [changes, hygiene]
    # Push to main is the merge; workflow_dispatch on main is the manual
    # self-heal path. The repository guard keeps forks from ever publishing.
    # The release gate paths are a subset of hygiene's, so a skipped hygiene
    # already implies this gate is false. Publish gates on hygiene alone: the
    # ruleset has already required the Test suite green on the pull request.
    if: github.repository == 'andrielson/docker-sandbox-templates' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out the repository (full history with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # The git tag is the publication record: present means already
      # released, absent means publish (a failed publish self-heals on the
      # next run, because the tag never landed). The version itself lives in
      # package.json — bumping it is the act of releasing (ADR-0003).
      - name: Read the version and decide whether to publish
        id: version
        run: |
          version=$(jq --raw-output '.version' package.json)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version '${version}' is not X.Y.Z semver" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/v${version}" > /dev/null; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  publish-amd64:
    name: Publish image (amd64)
    needs: publish
    if: needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push-by-digest: each architecture builds on its native runner and
      # publishes an anonymous digest; Publish manifest stitches both into
      # the tagged manifest list — no QEMU, whose emulated Nix stage would be
      # untenably slow, and the arm64 job doubles as proof the image builds
      # on that architecture. The cache ref is per-architecture so the two
      # concurrent builds never race one cache tag (ADR-0003).
      - name: Build and push the amd64 image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          platforms: linux/amd64
          pull: true
          outputs: type=image,name=ghcr.io/andrielson/sandbox-templates,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/andrielson/sandbox-templates:claude-code-docker-buildcache-amd64
          cache-to: |
            type=registry,ref=ghcr.io/andrielson/sandbox-templates:claude-code-docker-buildcache-amd64,mode=max
            type=inline
          labels: |
            org.opencontainers.image.title=sandbox-templates
            org.opencontainers.image.description=Custom batteries-included templates for Docker Sandboxes
            org.opencontainers.image.version=${{ needs.publish.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  publish-arm64:
    name: Publish image (arm64)
    needs: publish
    if: needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The arm64 twin of the amd64 job, byte-for-byte except for the
      # platform, the runner and the cache ref.
      - name: Build and push the arm64 image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          platforms: linux/arm64
          pull: true
          outputs: type=image,name=ghcr.io/andrielson/sandbox-templates,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/andrielson/sandbox-templates:claude-code-docker-buildcache-arm64
          cache-to: |
            type=registry,ref=ghcr.io/andrielson/sandbox-templates:claude-code-docker-buildcache-arm64,mode=max
            type=inline
          labels: |
            org.opencontainers.image.title=sandbox-templates
            org.opencontainers.image.description=Custom batteries-included templates for Docker Sandboxes
            org.opencontainers.image.version=${{ needs.publish.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  publish-manifest:
    name: Publish manifest
    # publish sits in needs for its outputs; the architecture jobs gate the
    # actual merge — if either fails to produce a digest, nothing gets tagged.
    needs: [publish, publish-amd64, publish-arm64]
    if: needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/andrielson/sandbox-templates
      VERSION: ${{ needs.publish.outputs.version }}
      AMD64_DIGEST: ${{ needs.publish-amd64.outputs.digest }}
      ARM64_DIGEST: ${{ needs.publish-arm64.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The two tags of one build (ADR-0003): the rolling variant tag and the
      # immutable semver tag, both mirroring the upstream sandbox-templates
      # naming — no `v` prefix, exactly like the upstream's own
      # claude-code-docker-0.5.0.
      - name: Merge the architecture manifests into the tagged image
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:claude-code-docker" \
            --tag "${IMAGE}:claude-code-docker-${VERSION}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
      - name: Inspect the published image
        run: docker buildx imagetools inspect "${IMAGE}:claude-code-docker"
      # The release creation makes the git tag too, which is the publication
      # record the Publish gate checks; a failure here self-heals on the next
      # run (the tag never landed, so the gate still says publish).
      - name: Create the git tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="v${VERSION}"
          gh release create "${release}" --repo andrielson/docker-sandbox-templates --title "${release}" --generate-notes --target "${{ github.sha }}"
